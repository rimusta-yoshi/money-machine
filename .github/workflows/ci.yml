name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # A quick builder stress test on every pull request: every trade × theme × content shape,
  # 5 seeds, on one runner (a tenth of the full matrix, a few minutes). The full run is stress.yml
  # (nightly and on main), which keeps Actions minutes low on a private repo.
  stress-quick:
    name: Quick stress test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the quick stress test
        run: npm run stress -- --seeds 5 --pages 4 --timeout-min 20 --out stress-quick.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-quick
          path: stress-quick.json
          if-no-files-found: ignore
