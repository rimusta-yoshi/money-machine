name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The builder stress test (scripts/stress-browser.mjs): every trade × theme × content shape
  # × 50 seeds, each section generated as the builder does it in real Chrome. Split across
  # runners; each runs four tabs side by side.
  stress:
    name: Stress test (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the stress test
        run: npm run stress -- --seeds 50 --pages 4 --shard ${{ matrix.shard }}/6 --out stress-${{ matrix.shard }}.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ matrix.shard }}
          path: stress-${{ matrix.shard }}.json
          if-no-files-found: ignore
