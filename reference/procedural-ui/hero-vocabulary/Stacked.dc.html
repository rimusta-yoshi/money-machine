<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#F4F2EE;color:#1F1D1A}
.s{box-sizing:border-box;border:1.5px dashed #8A857C;background:#E6E3DD;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;margin:0;font:inherit;text-align:left;text-decoration:none;color:inherit}

.m .t{color:#7A2E07}
.d{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4A463F}

<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 24px 40px 0; background: #F4F2EE">

<div class="s m c" style="width: 820px; height: 110px"><span class="t">Headline</span><span class="d">centred · max 2 lines · ≤ 820px measure</span></div>
<div class="s c" style="width: 640px; height: 56px"><span class="t">Subhead</span><span class="d">optional</span></div>
<div style="display: flex; gap: 12px">
<button class="s m c" style="width: 220px; height: 56px"><span class="t">Primary CTA</span><span class="d">≥ 44px</span></button>
<a class="s m c" href="tel:" style="width: 220px; height: 56px"><span class="t">Phone</span><span class="d">tel: link</span></a>
</div>
<div class="s img" style="width: 100%; flex-grow: 1; border-bottom: none; border-radius: 6px 6px 0 0"><span class="t">Image</span><span class="d">wide banner · bleeds off section bottom</span></div>
</div>
</div>
